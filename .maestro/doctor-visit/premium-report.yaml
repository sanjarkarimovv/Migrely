# Covers: doctor-visit › Opening the report from the reminder › Premium
# Fails on 1.1.1 and older, which have no "Doctor visit" section.
appId: com.migrely.app
name: With Premium the card's "Make a report" opens the Doctor report screen; Back returns to History
tags: [regression, doctor-visit, subscription, simulated-store]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/log-attack-today.yaml
- tapOn: ".*\\. Opens History\\."
- tapOn: "Doctor report"
- extendedWaitUntil:
    visible: "A report for your doctor"
    timeout: 10000
- runFlow:
    file: ../subflows/buy.yaml
    env:
      PLAN: "Monthly"
      BUTTON: "Subscribe"
      SHEET: "Complete the purchase"
- extendedWaitUntil:
    visible: "You have Premium"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Create report"
    timeout: 10000
- back
- back
- runFlow: ../subflows/open-reminders.yaml
- runFlow:
    file: ../subflows/set-visit.yaml
    env:
      OFFSET: 1
      DATE: ""
- back
- back
- extendedWaitUntil:
    visible: "Your doctor visit is on ${output.visitSpoken}\\."
    timeout: 5000
- tapOn: "Make a report"
- extendedWaitUntil:
    visible: "Create report"
    timeout: 10000
- assertVisible: "Doctor report"
- back
- extendedWaitUntil:
    visible: "History"
    timeout: 5000
