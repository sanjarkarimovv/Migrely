# Covers: app-settings › The settings list › Opening Settings
# Covers: app-settings › Warning signs › Reading them
# Covers: app-settings › Privacy and about › The version
# Covers: app-settings › Delete all data › Not typed
appId: com.migrely.app
name: Settings lists its sections; Warning signs and the version open; Delete all data waits for DELETE
tags: [regression, app-settings]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Settings"
- assertVisible: "Your diary"
- assertVisible: "Reminders.*"
- assertVisible: "Track periods.*"
- assertVisible: "Your data.*"
- assertVisible: "Look"
- assertVisible: "Theme.*"
- scrollUntilVisible:
    element: "Delete all data.*"
    direction: DOWN
    # Centred: at the screen's bottom edge a tap can land in the system gesture area.
    centerElement: true
- assertVisible: "Privacy and about"
- assertVisible: "Version"
# The installed version name sits under it, for example "0.1.0".
- assertVisible: "[0-9]+\\.[0-9]+\\.[0-9]+"
- scrollUntilVisible:
    element: "Warning signs.*"
    direction: UP
- tapOn: "Warning signs.*"
# The page's own lines: the Settings row has the title too.
- extendedWaitUntil:
    visible: "Call your local emergency number if a headache comes with any of these:"
    timeout: 5000
# The NHS emergency and urgent lists (BRD SAF-F1, D171, D173). Order is checked from a UI dump in the Go/No-Go, not here.
- assertVisible: "Extremely bad pain that came on suddenly"
- assertVisible: "Weakness or loss of movement on one side of your body or face"
- assertVisible: "Problems speaking or remembering things"
- assertVisible: "Losing your vision, or blurred or double vision"
- assertVisible: "Feeling drowsy or confused"
- assertVisible: "A seizure or fit"
- scrollUntilVisible:
    element: "A very high temperature and signs of meningitis, such as a stiff neck"
    direction: DOWN
# The rash sign carries the NHS meningitis page's note in brackets (D173); escaped, because the text is a regex.
- scrollUntilVisible:
    element: "A rash that doesn.t fade when you press a glass against it \\(this may be harder to see on brown or black skin\\)"
    direction: DOWN
# Maestro matches the whole text, so the sign without its note (before D173) must not be on screen.
- assertNotVisible: "A rash that doesn.t fade when you press a glass against it"
- scrollUntilVisible:
    element: "A head injury in the last 3 months"
    direction: DOWN
- scrollUntilVisible:
    element: "Don.t drive yourself to hospital\\. Call your local emergency number\\."
    direction: DOWN
- scrollUntilVisible:
    element: "Get urgent medical advice if you have a migraine attack and:"
    direction: DOWN
- scrollUntilVisible:
    element: "It has lasted longer than 72 hours"
    direction: DOWN
- scrollUntilVisible:
    element: "Aura symptoms last longer than 1 hour at a time"
    direction: DOWN
- scrollUntilVisible:
    element: "You.re pregnant or have just had a baby"
    direction: DOWN
- scrollUntilVisible:
    element: "If you have any other symptoms you.re worried about, get urgent medical advice\\."
    direction: DOWN
# The old list must be gone: a wait condition ("doesn't pass") and a sign the NHS does not list (D171).
- assertNotVisible: ".*doesn.t pass.*"
- assertNotVisible: "A first headache after the age of 50"
- assertNotVisible: "Sudden pain that is the worst of your life"
- back
# Delete all data: nothing happens until DELETE is typed exactly.
- scrollUntilVisible:
    element: "Delete all data.*"
    direction: DOWN
    # Centred: at the screen's bottom edge a tap can land in the system gesture area.
    centerElement: true
- tapOn: "Delete all data.*"
- extendedWaitUntil:
    visible: "Delete all data\\?"
    timeout: 5000
- tapOn: "Delete everything"
- assertVisible: "Delete all data\\?"
- tapOn: "Type DELETE to confirm"
- inputText: "delete"
- hideKeyboard
- tapOn: "Delete everything"
- assertVisible: "Delete all data\\?"
- back
- back
- assertVisible: "Migraine started"
