# Covers: app-settings › The settings list › Opening Settings
# Covers: app-settings › Warning signs › Reading them
# Covers: app-settings › Privacy and about › The version
# Covers: app-settings › Delete all data › Not typed
appId: com.migrely.app
name: Settings lists its sections; Warning signs and the version open; Delete all data waits for DELETE
tags: [regression, app-settings]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Settings"
- assertVisible: "Your diary"
- assertVisible: "Reminders.*"
- assertVisible: "Track periods.*"
- assertVisible: "Your data.*"
- assertVisible: "Look"
- assertVisible: "Theme.*"
- scrollUntilVisible:
    element: "Delete all data.*"
    direction: DOWN
- assertVisible: "Privacy and about"
- assertVisible: "Version"
# The installed version name sits under it, for example "0.1.0".
- assertVisible: "[0-9]+\\.[0-9]+\\.[0-9]+"
- scrollUntilVisible:
    element: "Warning signs.*"
    direction: UP
- tapOn: "Warning signs.*"
- extendedWaitUntil:
    visible: "Warning signs"
    timeout: 5000
- back
# Delete all data: nothing happens until DELETE is typed exactly.
- scrollUntilVisible:
    element: "Delete all data.*"
    direction: DOWN
- tapOn: "Delete all data.*"
- extendedWaitUntil:
    visible: "Delete all data\\?"
    timeout: 5000
- tapOn: "Delete everything"
- assertVisible: "Delete all data\\?"
- tapOn: "Type DELETE to confirm"
- inputText: "delete"
- hideKeyboard
- tapOn: "Delete everything"
- assertVisible: "Delete all data\\?"
- back
- back
- assertVisible: "Migraine started"
