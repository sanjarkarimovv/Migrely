# Covers: today-sky › Card stays current › Midnight passes
# The clock is set to 23:55 on the 15th (qa/device_scenarios.sh), so yesterday is always in the month shown.
# Home has stayed open across local midnight; nothing touches the new day.
appId: com.migrely.app
---
- extendedWaitUntil:
    visible: "Today: calm\\. Calm so far today\\. No migraine logged\\."
    timeout: 45000
- assertNotVisible: "Logged today"
- assertVisible: ".*: cloudy\\. 1 migraine\\. Peak: not recorded\\."
