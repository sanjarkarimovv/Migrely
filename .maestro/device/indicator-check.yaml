# Device scenario step: History's "Last 30 days" section for this month (MONTHS_BACK "0") or last month ("1").
# ROW (a regex) is a row that must show; "" means no section. DOCTOR "true" expects a reached row and the doctor line,
# "false" neither. The pairing is what passed the medical check (D151), so both directions are asserted.
# It leaves History open.
appId: com.migrely.app
---
- launchApp
- tapOn: ".*\\. Opens History\\."
- runFlow:
    when:
      true: ${MONTHS_BACK == "1"}
    commands:
      - tapOn: "Previous month"
      # The month really changed: its title is the month's name, not "<Month> so far".
      - scrollUntilVisible:
          element: "Days with attack medication: .*"
          direction: DOWN
      - assertNotVisible: "[A-Z][a-z]+ so far"
# Centred, so what follows the last summary row is on screen too.
- scrollUntilVisible:
    element: "Days with attack medication: .*"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      true: ${ROW == ""}
    commands:
      - assertNotVisible: "Last 30 days"
- runFlow:
    when:
      true: ${ROW != ""}
    commands:
      - scrollUntilVisible:
          element: "${ROW}"
          direction: DOWN
          centerElement: true
      - assertVisible: "Last 30 days"
- runFlow:
    when:
      true: ${DOCTOR == "true"}
    commands:
      - assertVisible: "Taking medication this often, month after month, can make headaches more frequent\\. It's worth talking to your doctor\\."
      - assertVisible: ".*\\. Doctors watch for 1[05] or more days a month\\."
- runFlow:
    when:
      true: ${DOCTOR == "false"}
    commands:
      - assertNotVisible: "Taking medication this often.*"
      - assertNotVisible: ".*Doctors watch for.*"
# The app stays open, so the script can read a row's colour.
