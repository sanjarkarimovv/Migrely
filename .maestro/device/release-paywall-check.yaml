# Device scenario step, release build: with no Premium products from Google Play, no paywall shows itself after
# onboarding, and a tap on Doctor report shows why Premium cannot be bought, with no buy button (D110, EC-BIL-11).
appId: com.migrely.app
---
- launchApp:
    clearState: true
- repeat:
    times: 4
    commands:
      - extendedWaitUntil:
          visible: "Step [1-4] of 4.*"
          timeout: 15000
      - extendedWaitUntil:
          visible: "QA: never shown, a pause for the 0.8 s tap guard"
          timeout: 1000
          optional: true
      - tapOn: "Skip this step"
- extendedWaitUntil:
    visible: "Today: calm. Calm so far today. No migraine logged."
    timeout: 15000
- extendedWaitUntil:
    visible: "Get more from your diary"
    timeout: 6000
    optional: true
- assertNotVisible: "Get more from your diary"
- tapOn: ".*\\. Opens History\\."
- tapOn: "Doctor report"
- extendedWaitUntil:
    visible: "Premium isn.t available in your region yet|Google Play can.t be reached right now"
    timeout: 15000
- assertNotVisible: "Start free trial|Subscribe|Buy once"
- tapOn: "Close"
- extendedWaitUntil:
    visible: "Doctor report"
    timeout: 5000
