# Device scenario step: Settings → Theme → THEME, staying on Settings, which the script measures (no force stop).
appId: com.migrely.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Settings"
    timeout: 10000
- tapOn: "Settings"
- tapOn: "Theme.*"
- extendedWaitUntil:
    visible: "During a migraine, Migrely stays dark\\."
    timeout: 5000
- tapOn: "${THEME}"
- extendedWaitUntil:
    visible: "QA: never shown, a pause for the theme to apply"
    timeout: 1500
    optional: true
- runFlow:
    when:
      visible: "During a migraine, Migrely stays dark\\."
    commands:
      - back
- extendedWaitUntil:
    visible: "Your diary"
    timeout: 5000
