# Device scenario step, on a phone whose data was just cleared: onboarding is skipped and no paywall shows itself
# afterwards, waited for 6 s (D110: only once billing is known to be available, with products).
appId: com.migrely.app
---
- launchApp
- repeat:
    times: 4
    commands:
      - extendedWaitUntil:
          visible: "Step [1-4] of 4.*"
          timeout: 15000
      - extendedWaitUntil:
          visible: "QA: never shown, a pause for the 0.8 s tap guard"
          timeout: 1000
          optional: true
      - tapOn: "Skip this step"
- extendedWaitUntil:
    visible: "Today: calm\\. Calm so far today\\. No migraine logged\\."
    timeout: 15000
- extendedWaitUntil:
    visible: "Get more from your diary"
    timeout: 6000
    optional: true
- assertNotVisible: "Get more from your diary"
