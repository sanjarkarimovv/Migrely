# Device scenario step: opened by the "Start migraine" shortcut, attack mode shows and no paywall shows itself there,
# waited for 6 s; then the attack is ended and home opens (D110: never during attack mode).
appId: com.migrely.app
---
- extendedWaitUntil:
    visible: "Migraine ended"
    timeout: 15000
- extendedWaitUntil:
    visible: "See your patterns|Get more from your diary"
    timeout: 6000
    optional: true
- assertNotVisible: "See your patterns|Get more from your diary"
- runFlow: ../subflows/end-attack.yaml
