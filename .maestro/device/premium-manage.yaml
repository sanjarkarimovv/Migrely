# Device scenario step: Settings › Manage subscription opens the simulated store's purchases, and CHOICE is chosen
# ("End the subscription", "Refund the lifetime purchase" or "Close").
appId: com.migrely.app
---
- launchApp
- tapOn: "Settings"
- tapOn: "Manage subscription|Manage"
- extendedWaitUntil:
    visible: "${CHOICE}"
    timeout: 10000
- tapOn: "${CHOICE}"
- stopApp
