# Device scenario step (privacy_link): Settings › Privacy ends with "Read the full privacy policy", and a tap hands the
# link to the browser (D119). The script reads the VIEW intent from the log, and with no browser checks the app and the
# page.
appId: com.migrely.app
---
- launchApp
- tapOn: "Settings"
- scrollUntilVisible:
    element: "What Migrely keeps, and where"
    direction: DOWN
    centerElement: true
- tapOn: "What Migrely keeps, and where"
- scrollUntilVisible:
    element: "Read the full privacy policy.*"
    direction: DOWN
    centerElement: true
- tapOn: "Read the full privacy policy.*"
