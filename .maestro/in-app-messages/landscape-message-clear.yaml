# Covers: in-app-messages › Messages appear at the top and stay dim › Message during attack mode
# Known bug (https://github.com/sanjarkarimovv/Migrely/issues/20): in landscape the start message covers Mild and
# Moderate. Runs in pass 2 (20 s accessibility timeout), so the message is surely still on screen when checked.
appId: com.migrely.app
name: In landscape the start message leaves every intensity choice visible
tags: [regression, in-app-messages, a11y-timeout, known-bug]
# Back to portrait even when an assertion fails, so later flows are not run in landscape.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- setOrientation: LANDSCAPE_LEFT
- runFlow: ../subflows/launch-clean.yaml
- tapOn:
    text: "Migraine started"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Undo the start"
    timeout: 5000
- assertVisible: "Mild"
- assertVisible: "Moderate"
- assertVisible: "Severe"
- assertVisible:
    text: "Migraine ended"
    index: 0
- takeScreenshot: in-app-messages-landscape-message
