# Covers: in-app-messages › Undo window follows the accessibility timeout › Longer accessibility timeout
# Runs in qa/maestro.sh pass 2, where Android's "Time to take action" is 20 s: the Undo offer must outlive the
# default 5 s window.
appId: com.migrely.app
name: A longer accessibility timeout keeps the Undo offer on screen
tags: [regression, in-app-messages, a11y-timeout]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn:
    text: "Migraine started"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
# A fixed 8 s wait, longer than the default 5 s window: the text below never appears, and the wait is optional.
- extendedWaitUntil:
    visible: "QA fixed wait, never on screen"
    timeout: 8000
    optional: true
- assertVisible: "Undo the start"
- takeScreenshot: in-app-messages-longer-timeout
