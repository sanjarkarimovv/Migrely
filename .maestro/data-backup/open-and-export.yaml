# Covers: data-backup › Your data › Opening Your data
appId: com.migrely.app
name: Your data offers export and import; a JSON backup and a CSV export save to Download
# The "saved" messages are short; pass 2 (a 20 s accessibility timeout) keeps them on screen for the check.
tags: [regression, data-backup, a11y-timeout]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/log-attack-today.yaml
- tapOn: "Settings"
- tapOn: "Your data.*"
- assertVisible: "Export a backup \\(JSON\\).*"
- assertVisible: "Export for Excel \\(CSV\\).*"
- assertVisible: "Import a backup.*"
- runFlow:
    file: ../subflows/export-file.yaml
    env:
      ROW: "Export a backup \\(JSON\\)"
      MESSAGE: "Backup saved\\."
- runFlow:
    file: ../subflows/export-file.yaml
    env:
      ROW: "Export for Excel \\(CSV\\)"
      MESSAGE: "Saved for Excel\\."
