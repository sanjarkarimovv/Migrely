# Covers: attack-history › History stays current › Rotation and process death (rotation part)
# The process-death part needs adb and runs in qa/device_scenarios.sh (Maestro's killApp is a force stop,
# which clears saved state on purpose, so it cannot show process death).
appId: com.migrely.app
name: The shown month and chosen day survive rotation
tags: [regression, attack-history]
# Back to portrait even when an assertion fails, so later flows are not run in landscape.
onFlowComplete:
  - setOrientation: PORTRAIT
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/add-past-attack-last-month.yaml
- tapOn: ".*\\. Opens History\\."
- tapOn: "Previous month"
- tapOn: ".*, [A-Za-z]+ 12: cloudy\\. 1 migraine\\. Peak: not recorded\\."
# The chosen day's controls sit below the month summary (change 5) and the day marks (change 4).
- scrollUntilVisible:
    element: "Show all of .*"
    direction: DOWN
- setOrientation: LANDSCAPE_LEFT
- scrollUntilVisible:
    element: "Show all of .*"
    direction: DOWN
- setOrientation: PORTRAIT
- scrollUntilVisible:
    element: "Show all of .*"
    direction: DOWN
- scrollUntilVisible:
    element: ".*, [A-Za-z]+ 12: cloudy\\. 1 migraine\\. Peak: not recorded\\..*"
    direction: UP

