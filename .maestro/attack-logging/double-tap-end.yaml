# Covers: attack-logging › Double taps never cross a mode switch › Double tap on "Migraine ended"
# Covers: attack-logging › End an attack in one tap › End an attack
# Regression guard for https://github.com/sanjarkarimovv/Migrely/issues/12 (fixed in PR #18): on the home screen "Migraine started" lies under the upper part of "Migraine ended", so the second tap of
# a double tap on "Migraine ended" starts a new attack. Same overlap as double-tap-start.yaml (QA AVD pixel_6).
appId: com.migrely.app
name: A rapid double tap on "Migraine ended" ends the attack and starts nothing
tags: [smoke, regression, attack-logging, geometry]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/start-attack.yaml
- runFlow: ../subflows/wait-message-gone.yaml
# doubleTapOn sends both taps as one quick gesture on the device, so Maestro's step time (1–7 s here) cannot
# stretch the gap. 88% of the height (y 2112 px) is inside the old overlap of the two buttons. Exact gaps
# (0.15 / 0.4 / 0.7 s) are covered by qa/device_scenarios.sh double_tap.
- doubleTapOn:
    point: "50%,88%"
- extendedWaitUntil:
    visible: "Today: cloudy. 1 migraine today. Peak: not recorded."
    timeout: 5000
- assertNotVisible: "Rest now. We'll keep time."
