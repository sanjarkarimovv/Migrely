# Covers: attack-logging › End an attack in one tap › End an attack
# Known bug (https://github.com/sanjarkarimovv/Migrely/issues/12): on the home screen "Migraine started" lies under the upper part of "Migraine ended", so the second tap of
# a double tap on "Migraine ended" starts a new attack. Same overlap as double-tap-start.yaml (QA AVD pixel_6).
appId: com.migrely.app
name: A rapid double tap on "Migraine ended" ends the attack and starts nothing
tags: [regression, attack-logging, known-bug]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/start-attack.yaml
- runFlow: ../subflows/wait-message-gone.yaml
# Two separate taps with no settle wait, so the second lands while the screen switches modes, like a finger
# tapping twice "to be sure". 88% of the height (y 2112 px) is inside the overlap with a margin on both sides.
- tapOn:
    point: "50%,88%"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- tapOn:
    point: "50%,88%"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Today: cloudy. 1 migraine today. Peak: not recorded."
    timeout: 5000
- assertNotVisible: "Rest now. We'll keep time."
