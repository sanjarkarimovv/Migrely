# Covers: attack-logging › Start an attack in one tap › Undo window passes
# Also checks (without timing it): the undo offer goes away by itself. The 5 s length was measured by hand (5.6–5.8 s).
# It runs with the 20 s "Time to take action" (a11y-timeout): under load, starting took the whole 5 s window and
# "Undo the start" was already gone (1.0.1 lines 3 and 10). So it waits up to 30 s for the offer to go.
appId: com.migrely.app
name: The undo offer disappears and the attack stays in progress
tags: [regression, attack-logging, in-app-messages, a11y-timeout]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/start-attack.yaml
- assertVisible: "Undo the start"
- extendedWaitUntil:
    notVisible: "Undo"
    timeout: 30000
- assertVisible: "Rest now. We'll keep time."
