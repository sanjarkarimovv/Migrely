# Covers: attack-logging › End an attack in one tap › Undo an end
# Covers: in-app-messages › Accessible messages › Spoken undo label ("Undo the end")
appId: com.migrely.app
name: Undoing the end restores the attack with its intensity
tags: [smoke, regression, attack-logging, in-app-messages]
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/start-attack.yaml
- tapOn: "Moderate"
- runFlow: ../subflows/wait-message-gone.yaml
# Undo is tapped as the very next action after the end (see in-app-messages/newest-wins.yaml).
- tapOn:
    text: "Migraine ended"
    index: 0
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- tapOn:
    text: "Undo the end"
    waitToSettleTimeoutMs: 0
    retryTapIfNoChange: false
- extendedWaitUntil:
    visible: "Rest now. We'll keep time."
    timeout: 5000
- assertVisible: "Undone."
- assertVisible:
    containsChild: "Moderate"
    checked: true
