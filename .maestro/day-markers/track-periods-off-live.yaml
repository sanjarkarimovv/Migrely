# Covers: day-markers › Track periods › Turning it off
# Covers: day-markers › Period today from home › Turning tracking off from home
# Turning "Track periods" off in Settings takes the Period toggle off home at once, as turning it on adds it at once.
# Regression test for #66 (fixed in PR #68): home kept "Period today" until the app restarted.
appId: com.migrely.app
name: Turning Track periods off takes the Period toggle off home at once (#66)
tags: [regression, day-markers]
---
- runFlow: ../subflows/launch-clean.yaml
- assertVisible: "Period today"
- tapOn: "Settings"
- tapOn: "Track periods"
- back
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 5000
- extendedWaitUntil:
    notVisible: "Period today"
    timeout: 5000
