# Covers: day-markers › Period today from home › Removing today's mark with tracking off
# Covers: day-markers › Period today from home › Period tracking off
# Covers: day-markers › Mark a chosen day › Removing a mark with tracking off
# Covers: day-markers › Mark a chosen day › Period tracking off
# With "Track periods" off, a period mark made before can still be removed, on home and in History, and a day without
# a mark offers only "Pain-free day" (#66, D79). Marks are read from the cells' spoken labels, as mark-and-remove does.
# The flow needs a past day of the current month, so it cannot run on the 1st.
appId: com.migrely.app
name: With Track periods off, earlier period marks can be removed and no new one is offered
tags: [regression, day-markers]
---
- runFlow: ../subflows/launch-clean.yaml
# Tracking on: today marked from home, and one empty past day marked in History.
- tapOn: "Period today"
- assertVisible:
    text: "Period today"
    checked: true
- tapOn: ".*\\. Opens History\\."
- assertVisible: "Today, .*: nothing logged\\. Period\\."
- runFlow: ../subflows/choose-empty-past-day.yaml
- evalScript: ${output.marked = output.day}
- tapOn:
    text: "Period"
    below: "No migraine logged on this day\\."
- scrollUntilVisible:
    element: "${output.marked}: nothing logged\\. Period\\."
    direction: UP
- back
# Tracking off. Home keeps the toggle while today has a mark; a tap removes the mark and leaves the toggle, off.
- tapOn: "Settings"
- tapOn: "Track periods"
- back
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 5000
- assertVisible:
    text: "Period today"
    checked: true
- tapOn: "Period today"
- assertVisible:
    text: "Period today"
    checked: false
# Away from home and back: the toggle is gone, and today's cell has no mark.
- tapOn: ".*\\. Opens History\\."
- assertVisible: "Today, .*: nothing logged\\."
- assertNotVisible: "Today, .*: nothing logged\\. Period\\."
- back
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 5000
- assertNotVisible: "Period today"
# After a restart, still no toggle.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 15000
- assertNotVisible: "Period today"
# The past day keeps its mark, shows "Period" as on, and a tap removes the mark.
- tapOn: ".*\\. Opens History\\."
- tapOn: "${output.marked}: nothing logged\\. Period\\."
- scrollUntilVisible:
    element: "Pain-free day"
    direction: DOWN
- assertVisible:
    text: "Period"
    below: "No migraine logged on this day\\."
    checked: true
- tapOn:
    text: "Period"
    below: "No migraine logged on this day\\."
- scrollUntilVisible:
    element: "${output.marked}: nothing logged\\."
    direction: UP
- assertNotVisible: "${output.marked}: nothing logged\\. Period\\."
# A day without a mark, chosen afresh: only "Pain-free day" below its heading.
- back
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 5000
- tapOn: ".*\\. Opens History\\."
- runFlow: ../subflows/choose-empty-past-day.yaml
- assertVisible: "Pain-free day"
- assertNotVisible:
    text: "Period"
    below: "No migraine logged on this day\\."
