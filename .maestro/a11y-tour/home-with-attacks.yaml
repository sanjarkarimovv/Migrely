# Accessibility tour state: home with two ended attacks listed under "Logged today".
appId: com.migrely.app
---
- runFlow: ../subflows/launch-clean.yaml
- runFlow: ../subflows/start-attack.yaml
- tapOn: "Mild"
- runFlow: ../subflows/end-attack.yaml
- runFlow: ../subflows/start-attack.yaml
- tapOn: "Severe"
- runFlow: ../subflows/end-attack.yaml
- swipe:
    from: "Migraine ended"
    direction: RIGHT
# The end message's Undo has the spoken name "Undo the end" and no "Undo" node (D181 (2)).
- extendedWaitUntil:
    notVisible: "Undo the end"
    timeout: 5000
