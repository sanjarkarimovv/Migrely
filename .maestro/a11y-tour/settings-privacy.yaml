# Accessibility tour state: Settings › What Migrely keeps, and where, at its top (D203).
appId: com.migrely.app
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "What Migrely keeps, and where"
    direction: DOWN
    centerElement: true
- tapOn: "What Migrely keeps, and where"
# The row's summary is not on the page itself; the page's first paragraph is.
- extendedWaitUntil:
    visible: "Migrely has no internet permission, so the app itself cannot send anything over the internet\\..*"
    timeout: 5000
# The purchase sentence comes right after it (D181 (1)).
- assertVisible: "Premium is bought through Google Play, which goes online for the purchase\\."

