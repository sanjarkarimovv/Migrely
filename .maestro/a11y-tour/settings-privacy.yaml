# Accessibility tour state: Settings › What Migrely keeps, and where, at its top (D203).
appId: com.migrely.app
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "What Migrely keeps, and where"
    direction: DOWN
    centerElement: true
- tapOn: "What Migrely keeps, and where"
# The row's summary is not on the page itself; the page's first paragraph is.
- extendedWaitUntil:
    visible: "Migrely has no internet access, so it sends nothing anywhere\\..*"
    timeout: 5000
