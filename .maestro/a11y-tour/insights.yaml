# Accessibility tour state: Insights with patterns, after buying Premium and adding 5 past migraines last month (D203).
# Needs the simulated store of the debug build (D201).
appId: com.migrely.app
tags: [simulated-store]
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: ".*\\. Opens History\\."
- tapOn: "Doctor report"
- extendedWaitUntil:
    visible: "A report for your doctor"
    timeout: 10000
- runFlow:
    file: ../subflows/buy.yaml
    env:
      PLAN: "Monthly"
      BUTTON: "Subscribe"
      SHEET: "Complete the purchase"
- extendedWaitUntil:
    visible: "You have Premium"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Create report"
    timeout: 10000
- back
- back
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 5000
# Days 15 to 21 are in the calendar's third or fourth row in every month. In landscape the date picker hides the first
# row and squeezes the second (#101), so earlier days could not be picked there.
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "15"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "16"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "18"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "19"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "21"}}
- tapOn: ".*\\. Opens History\\."
- tapOn: "Insights"
- extendedWaitUntil:
    visible: ".*5 migraines.*"
    timeout: 10000
