# Accessibility tour state: Insights with patterns, after buying Premium and adding 5 past migraines last month (D203).
# Needs the simulated store of the debug build (D201).
appId: com.migrely.app
---
- runFlow: ../subflows/launch-clean.yaml
- tapOn: ".*\\. Opens History\\."
- tapOn: "Doctor report"
- extendedWaitUntil:
    visible: "A report for your doctor"
    timeout: 10000
- runFlow:
    file: ../subflows/buy.yaml
    env:
      PLAN: "Monthly"
      BUTTON: "Subscribe"
      SHEET: "Complete the purchase"
- extendedWaitUntil:
    visible: "You have Premium"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Create report"
    timeout: 10000
- back
- back
- extendedWaitUntil:
    visible: "Today: .*"
    timeout: 5000
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "3"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "8"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "12"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "18"}}
- runFlow: {file: ../subflows/add-past-attack-on.yaml, env: {DAY: "24"}}
- tapOn: ".*\\. Opens History\\."
- tapOn: "Insights"
- extendedWaitUntil:
    visible: ".*5 migraines.*"
    timeout: 10000
