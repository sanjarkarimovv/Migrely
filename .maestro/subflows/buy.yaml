# Buys on an open paywall through the debug build's simulated store (D201): PLAN is "Yearly", "Monthly" or "Lifetime",
# BUTTON the action it shows ("Start free trial", "Subscribe" or "Buy once"), SHEET the sheet's choice ("Complete the
# purchase", "Pay later (pending)" or "Cancel").
appId: com.migrely.app
---
# At 200% in landscape a plan can be cut at the bottom edge, where a tap on its middle misses it.
- scrollUntilVisible:
    element: "${PLAN}\\. .*"
    direction: DOWN
    centerElement: true
- tapOn: "${PLAN}\\. .*"
# In landscape the button can be below the plans.
- scrollUntilVisible:
    element: "${BUTTON}"
    direction: DOWN
- tapOn: "${BUTTON}"
# The sheet's title and the product are one node ("Simulated Google Play" and a line under it).
- extendedWaitUntil:
    visible: "${SHEET}"
    timeout: 10000
- assertVisible: "(?s)Simulated Google Play.*"
- tapOn: "${SHEET}"
