# From the home screen with no attack in progress, start one and wait for attack mode.
appId: com.migrely.app
---
- tapOn:
    text: "Migraine started"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Rest now. We'll keep time."
    timeout: 5000
# Home ignores taps for 1–1.2 s after switching between normal and attack mode (TapGuard, fix for #12), and the
# rain or the message countdown keeps the screen moving, so this waits out the switch.
- waitForAnimationToEnd:
    timeout: 1500
